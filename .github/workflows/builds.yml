name: builds

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libarchive-dev libcurl4-openssl-dev g++-14

      - name: build
        run: |
          # ubuntu's libcurl carries versioned symbols, which bake a CURL_OPENSSL_4 requirement into stc that fedora cannot satisfy; the linker gets a version-stripped copy instead
          mkdir -p /tmp/nover
          libcurlfile=$(find /usr/lib -name 'libcurl.so.4' | head -1)
          cp "$libcurlfile" /tmp/nover/libcurl.so
          objcopy -R .gnu.version -R .gnu.version_r -R .gnu.version_d /tmp/nover/libcurl.so
          cmake --no-warn-unused-cli -DCMAKE_BUILD_TYPE:STRING=Release -S . -B ./build -G Ninja \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_EXE_LINKER_FLAGS="-L/tmp/nover"
          cmake --build ./build
          if readelf --version-info build/stc | grep -q CURL_OPENSSL_4; then
            echo "the libcurl symbol version is still baked in"; exit 1
          fi
          cd build
          cpack -G DEB
          cpack -G RPM
          cd ..
          mkdir out
          cp build/stc out/stc-linux-x86_64
          cp build/*.deb build/*.rpm out/
          ls -la out

      - name: read the version
        id: version
        run: |
          echo "version=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' props.json)" >> "$GITHUB_OUTPUT"

      - name: publish the tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "stc ${{ steps.version.outputs.version }}" \
            --notes "Binary for x86_64 Linux, a deb and an rpm. Build it yourself with make all if your distro is not covered." \
            --latest \
          || gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: publish the rolling release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "stc ${{ steps.version.outputs.version }} (latest master)" \
            --notes "Fresh build of master, replaced on every push. Pin a version with a tag instead." \
            --prerelease
